name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Engine dependencies
        run: dart pub get
        working-directory: packages/game_engine
      - name: Engine format
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/game_engine
      - name: Engine analysis
        run: dart analyze --fatal-infos
        working-directory: packages/game_engine
      - name: Engine tests
        run: dart test
        working-directory: packages/game_engine
      - name: CLI dependencies
        run: dart pub get
        working-directory: tools/game_cli
      - name: CLI analysis
        run: dart analyze --fatal-infos
        working-directory: tools/game_cli
      - name: CLI tests
        run: dart test
        working-directory: tools/game_cli

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/game_app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/game_app
      - run: flutter analyze --fatal-infos
        working-directory: apps/game_app
      - run: flutter test --coverage
        working-directory: apps/game_app
      - run: flutter build web --release
        working-directory: apps/game_app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff format --check backend
      - run: ruff check backend
      - run: mypy --config-file backend/pyproject.toml backend/src
      - run: pytest backend/tests --cov=life_api --cov-report=term-missing

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v3
      - name: Validate SAM and CloudFormation
        run: sam validate --lint --template-file infra/template.yaml

  container:
    runs-on: ubuntu-latest
    needs: [engine, backend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build authoritative API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: life-api:ci
