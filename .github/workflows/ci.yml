name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Engine dependencies
        run: dart pub get
        working-directory: packages/game_engine
      - name: Engine format
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/game_engine
      - name: Engine analysis
        run: dart analyze --fatal-infos
        working-directory: packages/game_engine
      - name: Engine tests
        run: dart test
        working-directory: packages/game_engine
      - name: AI dependencies
        run: dart pub get
        working-directory: packages/game_ai
      - name: AI format
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/game_ai
      - name: AI analysis
        run: dart analyze --fatal-infos
        working-directory: packages/game_ai
      - name: AI tests
        run: dart test
        working-directory: packages/game_ai
      - name: CLI dependencies
        run: dart pub get
        working-directory: tools/game_cli
      - name: CLI analysis
        run: dart analyze --fatal-infos
        working-directory: tools/game_cli
      - name: CLI tests
        run: dart test
        working-directory: tools/game_cli

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/game_app/tool/requirements-brand-icons.txt
      - name: Verify generated brand icons
        run: |
          python -m pip install -r apps/game_app/tool/requirements-brand-icons.txt
          python apps/game_app/tool/generate_brand_icons.py --check
      - name: Validate publication metadata
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app = Path("apps/game_app")
          canonical_id = "com.cmsflash.gameoflife"
          android_gradle = (app / "android/app/build.gradle.kts").read_text()
          ios_project = (app / "ios/Runner.xcodeproj/project.pbxproj").read_text()
          macos_config = (app / "macos/Runner/Configs/AppInfo.xcconfig").read_text()
          linux_cmake = (app / "linux/CMakeLists.txt").read_text()

          assert f'namespace = "{canonical_id}"' in android_gradle
          assert f'applicationId = "{canonical_id}"' in android_gradle
          assert f"PRODUCT_BUNDLE_IDENTIFIER = {canonical_id};" in ios_project
          assert f"PRODUCT_BUNDLE_IDENTIFIER = {canonical_id}" in macos_config
          assert f'set(APPLICATION_ID "{canonical_id}")' in linux_cmake

          manifest = ET.parse(app / "android/app/src/main/AndroidManifest.xml")
          application = manifest.getroot().find("application")
          android_ns = "{http://schemas.android.com/apk/res/android}"
          assert application is not None
          assert application.attrib[f"{android_ns}dataExtractionRules"] == "@xml/data_extraction_rules"
          assert application.attrib[f"{android_ns}fullBackupContent"] == "@xml/backup_rules"
          metadata = {
              item.attrib[f"{android_ns}name"]: item.attrib
              for item in application.findall("meta-data")
          }
          assert (
              metadata["com.google.firebase.messaging.default_notification_icon"]
              [f"{android_ns}resource"]
              == "@drawable/ic_stat_life"
          )
          assert (
              metadata["com.google.firebase.messaging.default_notification_color"]
              [f"{android_ns}resource"]
              == "@color/ic_notification_color"
          )

          web_manifest = json.loads((app / "web/manifest.json").read_text())
          assert web_manifest["name"] == "The Game of Life"
          assert any("maskable" in icon.get("purpose", "") for icon in web_manifest["icons"])
          assert all("?v=20260815-2x2" in icon["src"] for icon in web_manifest["icons"])

          icon_hashes = json.loads(
              (app / "assets/brand/app_icon_assets.sha256.json").read_text()
          )
          assert len(icon_hashes) == 44
          for relative, expected in icon_hashes.items():
              path = app / relative
              assert path.is_file(), relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, relative

          source_icon = (app / "assets/brand/app_icon.svg").read_text()
          android_foreground = (
              app / "android/app/src/main/res/drawable/ic_launcher_foreground.xml"
          ).read_text()
          for artwork in (source_icon, android_foreground):
              assert artwork.count("#B7F36B") == 2
              assert artwork.count("#F7F3EA") == 2
              assert "#FF765E" not in artwork
              assert "#7FC8FF" not in artwork

          web_index = (app / "web/index.html").read_text()
          assert ".life-startup-mark span:nth-child(1)" in web_index
          assert ".life-startup-mark span:nth-child(4)" in web_index
          assert ".life-startup-mark span:nth-child(2)" not in web_index
          assert "favicon.png?v=20260815-2x2" in web_index
          assert (
              'sizes="180x180" href="icons/Apple-touch-icon-180.png?v=20260815-2x2"'
              in web_index
          )
          push_worker = (app / "web/push-service-worker.js").read_text()
          assert push_worker.count("Icon-192.png?v=20260815-2x2") == 1
          assert push_worker.count("Badge-96.png?v=20260815-2x2") == 1
          adaptive = (
              app / "android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml"
          ).read_text()
          assert '@drawable/ic_launcher_monochrome' in adaptive
          assert (app / "assets/brand/play_store_icon_512.png").is_file()
          PY
      - run: flutter pub get
        working-directory: apps/game_app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/game_app
      - run: flutter analyze --fatal-infos
        working-directory: apps/game_app
      - run: flutter test --coverage
        working-directory: apps/game_app
      - name: Create ephemeral Android CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/game-of-life-ci.jks" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, O=cmsflash, C=US"
      - name: Build Android release app bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.com
        working-directory: apps/game_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/game-of-life-ci.jks
          ANDROID_KEYSTORE_PASSWORD: ci-only-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-only-password
      - name: Build self-hosted Flutter web release
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=API_BASE_URL=https://api.example.com
          grep -Eq '"useLocalCanvasKit"[[:space:]]*:[[:space:]]*true' build/web/flutter_bootstrap.js
          grep -Eq '"?fontFallbackBaseUrl"?[[:space:]]*:[[:space:]]*"/font-fallback/"' build/web/flutter_bootstrap.js
        working-directory: apps/game_app

  platform-releases:
    name: ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS and iOS
            os: macos-latest
            target: macos
          - name: Windows
            os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
        working-directory: apps/game_app
      - name: Build ${{ matrix.name }} release
        run: flutter build ${{ matrix.target }} --release --dart-define=API_BASE_URL=https://api.example.com
        working-directory: apps/game_app
      - name: Build unsigned iOS release
        if: runner.os == 'macOS'
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.com
        working-directory: apps/game_app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff format --check backend apps/game_app/tool
      - run: ruff check backend apps/game_app/tool
      - run: mypy --config-file backend/pyproject.toml backend/src
      - run: pytest backend/tests --cov=life_api --cov-report=term-missing

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v3
      - name: Validate SAM and CloudFormation
        run: |
          sam validate --lint --template-file infra/template.yaml
          sam validate --lint --region us-east-1 --template-file infra/web-template.yaml
          bash -n infra/deploy-web.sh infra/test-deploy-web.sh
          infra/test-deploy-web.sh

  container:
    runs-on: ubuntu-latest
    needs: [engine, backend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build authoritative API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: life-api:ci
