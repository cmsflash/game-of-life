<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A competitive, two-player evolution game inspired by Conway's Game of Life.">
  <meta name="theme-color" content="#0B0E13">
  <meta name="color-scheme" content="dark light">

  <!-- Link preview metadata -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="The Game of Life">
  <meta property="og:title" content="The Game of Life">
  <meta property="og:description" content="A competitive, two-player evolution game inspired by Conway's Game of Life.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="The Game of Life app icon">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="The Game of Life">
  <meta name="twitter:description" content="A competitive, two-player evolution game inspired by Conway's Game of Life.">
  <meta name="twitter:image" content="icons/Icon-512.png">
  <meta name="twitter:image:alt" content="The Game of Life app icon">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Game of Life">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>The Game of Life</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">

  <style>
    :root {
      color: #1d2018;
      background: #f7f5ed;
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #f7f5ed;
    }

    .life-startup {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: #f7f5ed;
    }

    .life-startup-card {
      width: min(100%, 360px);
      text-align: center;
    }

    .life-startup-mark {
      display: grid;
      grid-template-columns: repeat(2, 9px);
      gap: 4px;
      width: 22px;
      margin: 0 auto 24px;
      padding: 13px;
      border-radius: 13px;
      background: #171b22;
      box-shadow: 0 12px 30px rgb(23 27 34 / 16%);
    }

    .life-startup-mark span {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: #edf1e7;
    }

    .life-startup-mark span:nth-child(2),
    .life-startup-mark span:nth-child(3) {
      background: #cdeb98;
    }

    .life-startup-kicker {
      margin: 0 0 12px;
      color: #58722b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .life-startup h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 44px);
      font-weight: 750;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .life-startup-message {
      min-height: 48px;
      margin: 18px auto 20px;
      color: #55594f;
      font-size: 16px;
      line-height: 1.5;
    }

    .life-startup-progress {
      position: relative;
      overflow: hidden;
      width: min(100%, 260px);
      height: 4px;
      margin: 0 auto;
      border-radius: 999px;
      background: #e0e3d9;
    }

    .life-startup-progress::after {
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: inherit;
      background: #58722b;
      content: "";
      animation: life-startup-progress 1.2s ease-in-out infinite;
    }

    .life-startup-retry {
      visibility: hidden;
      min-height: 44px;
      margin-top: 22px;
      padding: 0 24px;
      border: 1px solid #58722b;
      border-radius: 999px;
      opacity: 0;
      color: #fff;
      background: #58722b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      pointer-events: none;
      animation: life-startup-retry 0s linear 30s forwards;
    }

    .life-startup-retry.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      animation: none;
    }

    .life-startup[data-state="error"] .life-startup-progress {
      display: none;
    }

    .life-startup[data-state="error"] .life-startup-kicker {
      color: #9c382d;
    }

    .life-noscript {
      box-sizing: border-box;
      max-width: 560px;
      margin: 80px auto;
      padding: 24px;
      color: #1d2018;
      font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    @keyframes life-startup-progress {
      from {
        transform: translateX(-115%);
      }

      to {
        transform: translateX(340%);
      }
    }

    @keyframes life-startup-retry {
      to {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .life-startup-progress::after {
        width: 65%;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main
    id="life-startup"
    class="life-startup"
    role="status"
    aria-live="polite"
    aria-busy="true"
    data-state="loading"
  >
    <div class="life-startup-card">
      <div class="life-startup-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="life-startup-kicker">The Game of Life</p>
      <h1>Preparing the board</h1>
      <p id="life-startup-message" class="life-startup-message">
        Loading the game engine. On mobile data this can take a moment.
      </p>
      <div class="life-startup-progress" aria-hidden="true"></div>
      <button
        id="life-startup-retry"
        class="life-startup-retry"
        type="button"
        aria-hidden="true"
        onclick="window.location.reload()"
      >
        Retry
      </button>
    </div>
  </main>

  <noscript>
    <p class="life-noscript">
      The Game of Life needs JavaScript to run. Enable JavaScript, then reload
      this page.
    </p>
  </noscript>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
