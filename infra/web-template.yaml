AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Production Flutter web hosting for The Game of Life: private S3 origin,
  CloudFront origin access control, SPA routing, security headers, optional
  access logs, and optional Route 53 aliases.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    Description: Environment label used in tags and globally scoped resource names.
  WebCustomDomainName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(?=.{1,253}$)(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$'
    Description: Optional web hostname, for example life.example.com.
  WebCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
    Description: >-
      Optional ACM certificate ARN for WebCustomDomainName. CloudFront requires
      this certificate to be in us-east-1.
  CreateRoute53Records:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create A and AAAA aliases for the custom web hostname.
  Route53HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 public hosted zone ID; required when DNS records are enabled.
  EnableAccessLogging:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Store CloudFront standard access logs in a dedicated retained bucket.
      Leave disabled when OAuth callback query strings may contain short-lived
      authorization or exchange codes.
  WebNoncurrentVersionRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days to retain noncurrent versions of deployed web objects.
  AccessLogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Number of days to retain CloudFront access log objects.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront edge-location price class.

Rules:
  CustomDomainParametersArePaired:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [{Ref: WebCustomDomainName}, ""]
                - Fn::Equals: [{Ref: WebCertificateArn}, ""]
            - Fn::And:
                - Fn::Not: [{Fn::Equals: [{Ref: WebCustomDomainName}, ""]}]
                - Fn::Not: [{Fn::Equals: [{Ref: WebCertificateArn}, ""]}]
        AssertDescription: WebCustomDomainName and WebCertificateArn must both be set or both be empty.
  Route53RequiresCustomDomain:
    RuleCondition:
      Fn::Equals: [{Ref: CreateRoute53Records}, "true"]
    Assertions:
      - Assert:
          Fn::And:
            - Fn::Not: [{Fn::Equals: [{Ref: WebCustomDomainName}, ""]}]
            - Fn::Not: [{Fn::Equals: [{Ref: WebCertificateArn}, ""]}]
            - Fn::Not: [{Fn::Equals: [{Ref: Route53HostedZoneId}, ""]}]
        AssertDescription: DNS aliases require the custom domain, certificate, and hosted zone.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref WebCustomDomainName, ""]]
  ShouldCreateRoute53Records: !And
    - !Condition HasCustomDomain
    - !Equals [!Ref CreateRoute53Records, "true"]
  AccessLoggingEnabled: !Equals [!Ref EnableAccessLogging, "true"]

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentWebReleases
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref WebNoncurrentVersionRetentionDays
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: the-game-of-life
        - Key: Environment
          Value: !Ref EnvironmentName

  AccessLogBucket:
    Type: AWS::S3::Bucket
    Condition: AccessLoggingEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCloudFrontAccessLogs
            Status: Enabled
            ExpirationInDays: !Ref AccessLogRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: the-game-of-life
        - Key: Environment
          Value: !Ref EnvironmentName

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub "Private S3 origin access for life-${EnvironmentName}"
        Name: !Sub "life-${EnvironmentName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          var staticPrefixes = ['/assets/', '/canvaskit/', '/icons/', '/.well-known/'];

          for (var i = 0; i < staticPrefixes.length; i++) {
            if (uri.indexOf(staticPrefixes[i]) === 0) {
              return request;
            }
          }

          if (uri.endsWith('/') || lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }

          return request;
        }
      FunctionConfig:
        Comment: Rewrite Flutter application routes, including /auth/callback, to index.html.
        Runtime: cloudfront-js-2.0
      Name: !Sub "life-${EnvironmentName}-spa-rewrite"

  FontFallbackRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var prefix = '/font-fallback';

          if (request.uri.indexOf(prefix + '/') === 0) {
            request.uri = request.uri.substring(prefix.length);
          }

          return request;
        }
      FunctionConfig:
        Comment: Remove the public font proxy prefix before the fonts.gstatic.com origin request.
        Runtime: cloudfront-js-2.0
      Name: !Sub "life-${EnvironmentName}-font-rewrite"

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Honor origin Cache-Control while omitting cookies and query strings from the S3 cache key.
        DefaultTTL: 3600
        MaxTTL: 31536000
        MinTTL: 0
        Name: !Sub "life-${EnvironmentName}-web-cache"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: Security headers for the Flutter web application.
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        Name: !Sub "life-${EnvironmentName}-web-security"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; form-action 'self';
              script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
              style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;
              font-src 'self' data:; connect-src 'self' https: wss:;
              worker-src 'self' blob:
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
            Preload: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          # The parameter may intentionally be empty when the default
          # CloudFront certificate is selected by HasCustomDomain.
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasCustomDomain
          - [!Ref WebCustomDomainName]
          - !Ref AWS::NoValue
        Comment: !Sub "The Game of Life ${EnvironmentName} Flutter web application"
        CacheBehaviors:
          - AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref WebCachePolicy
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FontFallbackRewriteFunction.FunctionARN
            PathPattern: font-fallback/*
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: flutter-fallback-fonts
            ViewerProtocolPolicy: redirect-to-https
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref WebCachePolicy
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: private-web-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Logging: !If
          - AccessLoggingEnabled
          - Bucket: !GetAtt AccessLogBucket.DomainName
            IncludeCookies: false
            Prefix: !Sub "${EnvironmentName}/"
          - !Ref AWS::NoValue
        Origins:
          - DomainName: !GetAtt WebBucket.RegionalDomainName
            Id: private-web-bucket
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
          - CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            DomainName: fonts.gstatic.com
            Id: flutter-fallback-fonts
            OriginPath: /s
        PriceClass: !Ref PriceClass
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref WebCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: the-game-of-life
        - Key: Environment
          Value: !Ref EnvironmentName

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: AccessLoggingEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub "${AccessLogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebAliasA:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref WebCustomDomainName
      Type: A

  WebAliasAAAA:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref WebCustomDomainName
      Type: AAAA

Outputs:
  WebBucketName:
    Description: Private bucket populated by infra/deploy-web.sh.
    Value: !Ref WebBucket
  WebBucketArn:
    Description: ARN of the private web content bucket.
    Value: !GetAtt WebBucket.Arn
  CloudFrontDistributionId:
    Description: Distribution ID used for release invalidations.
    Value: !Ref WebDistribution
  CloudFrontDomainName:
    Description: CloudFront distribution hostname.
    Value: !GetAtt WebDistribution.DomainName
  WebBaseUrl:
    Description: Public origin for the Flutter web application.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${WebCustomDomainName}"
      - !Sub "https://${WebDistribution.DomainName}"
  AccessLogBucketName:
    Condition: AccessLoggingEnabled
    Description: Retained S3 bucket containing CloudFront access logs.
    Value: !Ref AccessLogBucket
